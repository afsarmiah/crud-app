<!DOCTYPE html>
<html lang="en">

<head>

<body>

        <!-- <a class="header__home" href="/">Home</a> -->
    </header>

    <main>
        <section class="add-page">
            <div class="add-page__classroom">
                <h1 class="add-page__classroom-name">Afsar's
                    <span class="add-page__classroom-name-coloured">Classroom</span>
                </h1>
                <a class="add-page__back-to-student" href="/">Back to students</a>
            </div>
        </section>

        <section class="add-form">
            <h2 class="add-form__title">Update a student</h2>
            <form name="update-student" class="add-student" class="student-form" novalidate>

                <input type="text" name="_id" hidden>

                <div class="form-container">
                    <div class="form-row">
                        <label for="name" class="label">Name</label>
                        <input type="text" name="name" id="name" class="input" placeholder="Enter student name"
                            required>
                        <label for="name" class="error" aria-live="polite"></label>
                    </div>

                    <div class="form-row">
                        <label for="age" class="label">Age</label>
                        <input type="number" name="age" id="age" class="input" placeholder="Enter age" min="1" step="1"
                            required>
                        <label for="age" class="error" aria-live="polite"></label>
                    </div>
                </div>

                <div class="form-container">
                    <div class="form-row">
                        <label for="gender" class="label">Gender</label>
                        <select id="gender" name="gender" class="input" required>
                            <option value="">Select gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                        <label for="gender" class="error" aria-live="polite"></label>
                    </div>

                    <div class="form-row">
                        <label for="year" class="label">Year Group</label>
                        <select id="year" name="year" class="input" required>
                            <option value="">Select year group</option>
                            <option>Year 7</option>
                            <option>Year 8</option>
                            <option>Year 9</option>
                            <option>Year 10</option>
                            <option>Year 11</option>
                            <option>Year 12</option>
                            <option>Year 13</option>
                        </select>
                        <label for="name" class="error" aria-live="polite"></label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="course" class="label">Course</label>
                    <input type="text" id="course" name="course" placeholder="Enter course" class="input" required>
                    <label for="course" class="error" aria-live="polite"></label>
                </div>

                <div class="form-actions">
                    <button type="reset" class="reset-button">Reset</button>
                    <button type="submit" class="submit-button">Update Student</button>
                </div>
            </form>

        </section>
    </main>

</body>

</html>
